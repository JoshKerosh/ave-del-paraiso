<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Panel Ave del Paraíso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rosarivo&family=Raleway:wght@400;500;600;700&display=swap">
<style>
/* VOICE: la trastienda tranquila de Mar; pocas palabras, todo a un toque.
   IDEA: un tocador con espejo: a la izquierda los cajones (secciones), al centro lo que se cambia, a la derecha el espejo (la página en vivo).
   PICTURE: la vista previa real del sitio, en celular o computadora, que cambia mientras Mar escribe.
   COLOUR and TYPE: azul del Panel, papel, crema y miel; Rosarivo para títulos y Raleway para todo lo demás.
   LAYOUT: tres columnas en computadora; en celular, lista de secciones → editor → vista previa a pantalla completa. */
:root{color-scheme:light dark;
 --papel:light-dark(#FBF8F3,#141A21);--tarj:light-dark(#FFFFFF,#1C242D);--crema:light-dark(#F1EADF,#25303B);
 --tinta:light-dark(#2A2F35,#EEE8DE);--suave:light-dark(#67675A,#A9A397);--linea:light-dark(#E4DCCF,#33404D);
 --azul:light-dark(#37516A,#9DB9D3);--azul-f:light-dark(#37516A,#2D4357);--sobre:#FBF8F3;--miel:#E9B566;--miel-t:light-dark(#7A5E2E,#E9C88A);
 --rojo:light-dark(#A6473A,#E39B8E);--verde:light-dark(#4F6B43,#A9C49C);
 --serif:'Rosarivo',Georgia,serif;--sans:'Raleway','Helvetica Neue',Arial,sans-serif;--curva:cubic-bezier(.22,1,.36,1)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:15px/1.5 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15;text-wrap:balance}
.app{display:grid;grid-template-columns:232px minmax(360px,460px) minmax(0,1fr);height:100%}
/* barra lateral del Panel */
.side{background:var(--azul-f);color:var(--sobre);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 18px;gap:18px;overflow:auto}
.marca{display:flex;flex-direction:column;gap:2px;padding:0 10px}
.marca b{font-family:var(--serif);font-weight:400;font-size:15px;letter-spacing:.2em}
.marca span{font-size:11px;letter-spacing:.14em;opacity:.85}
.volver{display:flex;align-items:center;gap:6px;font-size:13px;opacity:.85;padding:0 10px;color:inherit;text-decoration:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grupo{font-size:11px;letter-spacing:.12em;opacity:.85;padding:12px 10px 4px;font-weight:600}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:0 12px;border:0;border-radius:10px;background:none;color:inherit;text-align:left;cursor:pointer;font-size:14.5px}
.nav button[aria-current=true]{background:rgba(251,248,243,.14);font-weight:600}
.nav .nb{min-width:22px;height:22px;border-radius:999px;background:var(--miel);color:#3F3420;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
.fotos-inv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fi{position:relative;aspect-ratio:4/5;border-radius:10px;overflow:hidden;background:var(--crema)}
.fi img{width:100%;height:100%;object-fit:cover;display:block}
.fi .pr{position:absolute;left:6px;bottom:6px;background:var(--azul-f);color:var(--sobre);font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px}
.mini-b{position:absolute;top:5px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(251,248,243,.92);color:#2A2F35;cursor:pointer;font-size:14px;line-height:1}
.mini-b{left:5px}.mini-b.q{left:auto;right:5px}
.fi.agregar{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:1.5px dashed var(--linea);cursor:pointer;background:var(--tarj)}
.fi.agregar span{font-size:26px;line-height:1;color:var(--azul)}.fi.agregar small{font-size:11.5px;color:var(--suave)}
.cifras-p{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cifras-p>div{background:var(--tarj);border:1px solid var(--linea);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.cifras-p b{font-family:var(--serif);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.cifras-p span{font-size:12.5px;color:var(--suave)}
.barra-c{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bc{height:10px;border-radius:999px;background:var(--crema);overflow:hidden}.bc i{display:block;height:100%;background:var(--azul-f);border-radius:999px;transition:width .2s}
.barra-c b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.atajos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pdf-hoja{background:#fff;color:#2A2F35;border:1px solid var(--linea);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(42,47,53,.12)}
.pdf-p{background:#37516A;color:#FBF8F3;border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:4px}
.pdf-p b{font-family:var(--serif);font-weight:400;letter-spacing:.22em;font-size:18px}.pdf-p span{font-size:9px;letter-spacing:.5em;opacity:.8}.pdf-p i{font-style:normal;font-family:var(--serif);font-size:16px;margin-top:10px}.pdf-p small{font-size:12px;opacity:.85}
.pdf-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.pdf-g div{display:flex;flex-direction:column;gap:3px;font-size:12px}.pdf-g img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 4px 4px}.pdf-g span{font-family:var(--serif);font-size:13px;line-height:1.2}.pdf-g small{color:#67675A}
#entrar{position:fixed;inset:0;z-index:60;background:var(--papel);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.login{width:min(400px,100%);display:flex;flex-direction:column;gap:14px}
.login h1{font-size:30px}
body.sin-sesion{overflow:hidden}
.seg [role=radio][aria-checked=true]{background:var(--tarj);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.grupo-c{font-size:11.5px;letter-spacing:.12em;color:var(--suave);font-weight:700;padding:18px 2px 4px}
.nav .pt{width:7px;height:7px;border-radius:50%;background:var(--miel);flex:none}
.side .pie{margin-top:auto;font-size:12px;opacity:.85;padding:0 10px;line-height:1.45}
/* editor */
.ed{display:flex;flex-direction:column;border-right:1px solid var(--linea);background:var(--papel);overflow:hidden}
.cab{padding:calc(20px + env(safe-area-inset-top,0px)) 24px 16px;border-bottom:1px solid var(--linea);display:flex;flex-direction:column;gap:12px}
.cab h1{font-size:28px}
.cab .s{font-size:13.5px;color:var(--suave);margin:0}
.estado{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;background:var(--crema);font-size:12.5px;font-weight:600}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--verde)}
.chip.pend i{background:var(--miel)}
.cuerpo{flex:1;overflow:auto;padding:20px 24px 120px;display:flex;flex-direction:column;gap:18px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo>span{font-size:13px;font-weight:600}
.campo small{font-size:12.5px;color:var(--suave)}
.in,textarea.in{width:100%;border:1px solid var(--linea);background:var(--tarj);border-radius:12px;padding:11px 14px;font-size:16px;outline:none;transition:border-color .2s}
textarea.in{resize:vertical;min-height:96px;line-height:1.5}
.in:focus{border-color:var(--azul)}
.cuenta{align-self:flex-end;font-size:12px;color:var(--suave);font-variant-numeric:tabular-nums}
.foto{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.foto img{width:120px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block;background:var(--crema)}
.foto .acc{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--azul);background:transparent;color:var(--azul);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none}
.btn.azul{background:var(--azul-f);border-color:var(--azul-f);color:var(--sobre)}
.btn.chico{min-height:36px;padding:0 14px;font-size:13px}
.btn.texto{border:0;padding:0 6px;min-height:36px}
.btn:disabled{opacity:.4;cursor:default}
.tarjeta{background:var(--tarj);border:1px solid var(--linea);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fila{display:flex;align-items:center;gap:12px;min-height:52px}
.fila+.fila{border-top:1px solid var(--linea)}
.fila .t{flex:1;display:flex;flex-direction:column}
.fila .t small{font-size:12.5px;color:var(--suave)}
.sw{position:relative;width:46px;height:28px;flex:none;border-radius:999px;border:0;background:var(--linea);cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s var(--curva)}
.sw[aria-checked=true]{background:var(--azul-f)}.sw[aria-checked=true]::after{transform:translateX(18px)}
.mv{display:flex;gap:2px}
.mv button{width:34px;height:34px;border-radius:50%;border:1px solid var(--linea);background:var(--tarj);cursor:pointer;font-size:14px}
.mv button:disabled{opacity:.3;cursor:default}
.piezas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pz{position:relative;border:0;padding:0;background:none;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.pz img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:999px 999px 6px 6px;display:block;outline:2px solid transparent;outline-offset:2px;transition:outline-color .2s}
.pz[aria-pressed=true] img{outline-color:var(--miel)}
.pz .n{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--miel);color:#3F3420;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.pz span{font-family:var(--serif);font-size:13.5px;line-height:1.2}
.pz:disabled{opacity:.4;cursor:default}
.preg{display:flex;flex-direction:column;gap:8px;padding:12px 0}
.preg+.preg{border-top:1px solid var(--linea)}
.preg .top{display:flex;gap:8px;align-items:center;justify-content:space-between}
.preg .top b{font-size:12px;color:var(--suave);font-weight:600}
.cod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 0;border:0;background:none;text-align:left;width:100%;cursor:pointer}
.cod+.cod{border-top:1px solid var(--linea)}
.cod b{font-weight:700;letter-spacing:.08em}
.cod small{grid-column:1;font-size:12.5px;color:var(--suave)}
.est{grid-row:1/3;grid-column:2;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--crema)}
.est.activo{color:var(--verde)}.est.vencido{color:var(--rojo)}.est.pausado{color:var(--suave)}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:inline-flex;background:var(--crema);border-radius:999px;padding:3px}
.seg button{border:0;background:none;min-height:36px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:600;color:var(--suave);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--tarj);color:var(--tinta);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.nota{font-size:12.5px;color:var(--suave);margin:0}
.barra{position:sticky;bottom:0;margin-top:auto;display:flex;gap:10px;padding:14px 24px calc(14px + env(safe-area-inset-bottom,0px));background:var(--papel);border-top:1px solid var(--linea)}
.barra .btn{flex:1}
/* vista previa */
.vista{display:flex;flex-direction:column;background:var(--crema);overflow:hidden}
.vcab{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 24px 12px}
.vcab h2{font-size:18px}
.vcab small{display:block;font-family:var(--sans);font-size:12.5px;color:var(--suave)}
.marco{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:4px 24px 24px;overflow:hidden}
.pantalla{background:var(--tarj);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(42,47,53,.18),0 0 0 1px var(--linea);height:100%;transition:width .45s var(--curva)}
.pantalla.cel{width:390px;border-radius:34px;border:10px solid #1E2329}
.pantalla.pc{width:100%}
.pantalla iframe{width:100%;height:100%;border:0;display:block;background:#F6F1EA}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--azul-f);color:var(--sobre);border-radius:999px;padding:10px 10px 10px 20px;display:flex;align-items:center;gap:12px;font-size:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);animation:sube .3s var(--curva);max-width:calc(100vw - 32px)}
.toast button{border:0;border-radius:999px;background:var(--sobre);color:#37516A;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;white-space:nowrap}
@keyframes sube{from{opacity:0;transform:translate(-50%,14px)}}
.velo{position:fixed;inset:0;background:rgba(20,26,33,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--papel);width:min(520px,100%);max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:subeh .35s var(--curva)}
@media(min-width:1024px){.velo{align-items:center}.hoja{border-radius:22px}}
@keyframes subeh{from{transform:translateY(30px);opacity:0}}
.hoja h2{font-size:24px}
.acciones{display:flex;gap:10px;flex-wrap:wrap}.acciones .btn{flex:1}
.btn.rojo{border-color:var(--rojo);color:var(--rojo)}
:focus-visible{outline:2px solid var(--miel);outline-offset:2px}
.solo-cel{display:none}
/* celular y tablet */
@media(max-width:1023px){
 body{overflow:auto}
 .app{display:block;height:auto}
 .side{display:none}
 .ed{border:0;min-height:100%}
 .vista{display:none}
 .vista.abierta{display:flex;position:fixed;inset:0;z-index:30}
 .vista.abierta .pantalla.cel{width:100%;border:0;border-radius:0;box-shadow:none}
 .vista.abierta .marco{padding:0}
 .solo-cel{display:inline-flex}
 .toast{bottom:calc(88px + env(safe-area-inset-bottom,0px));border-radius:18px}
 .solo-pc{display:none!important}
 .cab{position:sticky;top:0;z-index:5;background:var(--papel)}
 .barra{position:fixed;left:0;right:0;bottom:0;z-index:10}
 .lista-sec{display:flex;flex-direction:column}
 .lista-sec button{display:flex;align-items:center;gap:12px;min-height:58px;border:0;background:none;border-bottom:1px solid var(--linea);text-align:left;cursor:pointer;padding:0 2px}
 .lista-sec .t{flex:1;display:flex;flex-direction:column}
 .lista-sec small{font-size:12.5px;color:var(--suave)}
}
@media(max-width:600px){.cuerpo{padding:16px 16px 120px}.cab{padding-left:16px;padding-right:16px}.barra{padding-left:16px;padding-right:16px}.piezas{grid-template-columns:repeat(3,minmax(0,1fr))}.dos{grid-template-columns:1fr}.foto{grid-template-columns:96px 1fr}.foto img{width:96px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="app">
  <aside class="side" aria-label="Panel">
    <div class="marca"><b>AVE DEL PARAÍSO</b><span>Panel</span></div>
    <a class="volver" href="index.html">‹ Ver la página</a>
    <nav class="nav" id="nav" aria-label="Secciones del Panel"></nav>
    <p class="pie">Prototipo. Los cambios se guardan en este navegador; en el Panel real los guarda el servidor.</p>
  </aside>
  <main class="ed" id="ed"></main>
  <section class="vista" id="vista" aria-label="Vista previa">
    <div class="vcab"><div><h2>Vista previa<small id="vsub">Así se ve con tus cambios, antes de publicar</small></h2></div>
      <div style="display:flex;gap:8px;align-items:center"><div class="seg solo-pc" role="group" aria-label="Tamaño"><button data-tam="cel" aria-pressed="true">Celular</button><button data-tam="pc" aria-pressed="false">Computadora</button></div><button class="btn chico solo-cel" data-a="cerrar-vista">Cerrar</button></div></div>
    <div class="marco"><div class="pantalla cel" id="pantalla"><iframe id="ifr" name="vista-previa" title="Vista previa de la página" src="index.html"></iframe></div></div>
  </section>
</div>
<div id="capa"></div>
<main id="entrar" hidden></main>
<script src="contenido.js"></script>
<script>
{
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECC=[
 {id:'inicio',t:'Inicio',s:'Hoy y lo que necesita atención',g:'INICIO'},
 {id:'piezas',t:'Piezas',s:'Inventario: precios, cantidades, fotos y ventas',g:'INVENTARIO'},
 {id:'nueva',t:'Nueva pieza',s:'Se guarda solo completa',g:'INVENTARIO'},
 {id:'pedidos',t:'Pedidos del carrito',s:'Lo que las clientas mandaron por WhatsApp',g:'VENTAS'},
 {id:'ventas',t:'Ventas',s:'El mes, por canal, y registrar una venta',g:'VENTAS'},
 {id:'pdf',t:'Catálogo PDF',s:'El PDF para mandar por WhatsApp',g:'PUBLICAR'},
 {id:'instagram',t:'Instagram',s:'Preparar y publicar posts',g:'PUBLICAR'},
 {id:'visitas',t:'Datos de visitas',s:'Qué se ve, qué se busca, qué se pide',g:'DATOS'},
 {id:'portada',t:'Portada',s:'Imagen, título y frase'},
 {id:'aviso',t:'Aviso de arriba',s:'Una línea sobre todo el sitio'},
 {id:'secciones',t:'Secciones',s:'Cuáles se ven y en qué orden'},
 {id:'especiales',t:'Piezas especiales',s:'Hasta 6 en la portada'},
 {id:'confianza',t:'Envíos, pagos y cambios',s:'Las 4 frases de confianza'},
 {id:'nosotros',t:'Nosotros',s:'Imagen e historia'},
 {id:'preguntas',t:'Preguntas frecuentes',s:'Agregar, editar y ordenar'},
 {id:'contacto',t:'Contacto y cierre',s:'WhatsApp, redes y la invitación final'},
 {id:'codigos',t:'Códigos de descuento',s:'Para el carrito y los pedidos'},
 {id:'privacidad',t:'Privacidad',s:'La página de política de privacidad'},
 {id:'cuenta',t:'Cuenta',s:'Tu sesión y la seguridad del Panel',g:'CUENTA'}];
const SOLO=['inicio','piezas','nueva','pedidos','ventas','pdf','instagram','visitas','cuenta'];
let B=AVE.borrador(), PUB=JSON.stringify(AVE.publicado()), actual=null, PIEZAS=[];
const cel=()=>matchMedia('(max-width:1023px)').matches;
const cambios=()=>JSON.stringify(B)!==PUB;
function guardar(){AVE.escribir(AVE.K_BOR,B);pintarEstado()}
function pintarEstado(){const c=cambios();const e=$('#estado');if(e)e.innerHTML=c?'<span class="chip pend"><i></i>Cambios sin publicar</span>':'<span class="chip"><i></i>Todo publicado</span>';
  const pb=$('#publicar');if(pb)pb.disabled=!c;const ds=$('#descartar');if(ds)ds.disabled=!c;
  $('#nav').innerHTML=SECC.map((x,i)=>`${grupoDe(i)?`<div class="grupo">${grupoDe(i)}</div>`:''}<button data-sec="${x.id}" aria-current="${actual===x.id?'page':'false'}">${x.t}${x.id==='pedidos'&&nuevos()?`<span class="nb">${nuevos()}</span>`:difSec(x.id)?'<span class="pt" title="Cambios sin publicar"></span>':''}</button>`).join('')}
function leerPed(){try{return JSON.parse(localStorage.getItem('ave-pedidos')||'[]')}catch(e){return []}}
function guardarPed(P){try{localStorage.setItem('ave-pedidos',JSON.stringify(P))}catch(e){}}
const nuevos=()=>leerPed().filter(x=>x.estado==='nuevo').length;
function difSec(id){if(id==='pedidos')return false;const P=JSON.parse(PUB);const k=id==='contacto'?['contacto','cierre']:[id];return k.some(q=>JSON.stringify(B[q])!==JSON.stringify(P[q]))}

let INV=[], EDITA=null, FIL={q:'',est:'todas',cat:''}, FOTOS=[];
const CATS=['Collares','Anillos','Pulseras','Vestidos','Blusas','Bolsos y cuero'];

const tImg=x=>x.startsWith('data:')?x:x.replace('img/','img/t/').replace('img/t/t/','img/t/');
const hoyISO=()=>new Date().toISOString().slice(0,10);
function guardarInv(){if(!AVE.escribir(AVE.K_INV,INV)){aviso('No se pudo guardar: las fotos pesan demasiado para este navegador.');return false}return true}
function estadoPz(p){if(p.oculta)return ['Oculta','var(--suave)'];if(vendida(p))return ['Vendida','var(--rojo)'];if(p.units){const n=p.units.filter(u=>!u.vendido).length;return [`${n} de ${p.units.length} anillos`,'var(--verde)']}if((p.cantidad||1)>1)return [`Quedan ${p.cantidad}`,'var(--verde)'];return ['Disponible','var(--verde)']}
function grupoDe(i){const g=SECC[i].g||'PERSONALIZAR LA PÁGINA',ant=i?(SECC[i-1].g||'PERSONALIZAR LA PÁGINA'):null;return g!==ant?g:''}
function venderUna(p,l){if(p.units){const u=p.units.find(x=>x.l===l)||p.units.find(x=>!x.vendido);if(u)u.vendido=true;if(p.units.every(x=>x.vendido))p.vendidoEl=hoyISO();return u&&u.l}
  if((p.cantidad||1)>1){p.cantidad--;p.vendidas=(p.vendidas||0)+1}else{p.vendido=true;p.vendidoEl=hoyISO()}return ''}
function deshacerUna(p,l){if(p.units){const u=p.units.find(x=>x.l===l);if(u)u.vendido=false;delete p.vendidoEl;return}
  if(p.vendido){p.vendido=false;delete p.vendidoEl}else if(p.vendidas){p.vendidas--;p.cantidad=(p.cantidad||1)+1}}
V.piezas=()=>{
  if(EDITA){const p=INV.find(x=>x.id===EDITA);return p?editorHTML(p,false):'<p class="nota">No encontré esa pieza.</p>'}
  const q=FIL.q.trim().toLowerCase();
  const L=INV.filter(p=>(!FIL.cat||p.cat===FIL.cat)&&(FIL.est==='todas'||(FIL.est==='disp'&&!p.oculta&&!vendida(p))||(FIL.est==='vend'&&vendida(p))||(FIL.est==='ocul'&&p.oculta))&&(!q||p.nombre.toLowerCase().includes(q)||p.code.toLowerCase().includes(q)||p.code.split(' ')[1]===q.replace(/\D/g,'')));
  const n=k=>INV.filter(p=>k==='todas'||(k==='disp'&&!p.oculta&&!vendida(p))||(k==='vend'&&vendida(p))||(k==='ocul'&&p.oculta)).length;

   <select class="in" id="inv-cat" style="width:auto;min-height:40px;padding:6px 12px" aria-label="Categoría"><option value="">Todas las categorías</option>${CATS.map(c=>`<option ${FIL.cat===c?'selected':''}>${c}</option>`).join('')}</select></div>
   <p class="nota">${L.length} ${L.length===1?'pieza':'piezas'}. Toca una para cambiar precio, cantidad, fotos o marcarla vendida.</p>
   <div class="tarjeta" style="gap:0;padding:4px 14px">${L.map(p=>{const [e,c]=estadoPz(p);return `<button class="cod" data-inv="${p.id}" style="grid-template-columns:auto 1fr auto"><img src="${tImg(p.imgs[0])}" alt="" style="grid-row:1/3;grid-column:1;width:44px;height:56px;object-fit:cover;border-radius:999px 999px 5px 5px;${vendida(p)||p.oculta?'opacity:.55':''}"><b style="grid-column:2;grid-row:1;padding-left:12px;letter-spacing:0;font-weight:600">${esc(p.nombre)}</b><span class="est" style="grid-column:3;grid-row:1/3;align-self:center;color:${c}">${e}</span><small style="grid-column:2;grid-row:2;padding-left:12px">${p.code} · ${p.antes?`<s>${AVE.fmt(p.antes)}</s> `:''}${AVE.fmt(p.price)} · ${esc(p.cat)}</small></button>`}).join('')||'<p class="nota" style="padding:14px 0">Nada con ese filtro.</p>'}</div>`;
};
V.nueva=()=>editorHTML(null,true);
function editorHTML(p,nueva){
  const x=p||{nombre:'',cat:'',price:'',cantidad:1,talla:'',material:'',desc:'',imgs:[]};
  if(!FOTOS.length||FOTOS._de!==(p?p.id:'nueva')){FOTOS=[...x.imgs];FOTOS._de=p?p.id:'nueva'}
  const normal=x.antes||x.price, oport=x.antes?x.price:'';
  const sold=p&&vendida(p);
  const venta=!p?'':p.units?`<div class="tarjeta"><b style="font-weight:600">Anillos del grupo</b><p class="nota">Toca una letra para marcarla vendida o devolverla.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px">${p.units.map(u=>`<button type="button" class="btn chico" data-unit="${u.l}" aria-pressed="${u.vendido}" aria-label="Anillo ${u.l}, talla ${esc(u.talla||'sin talla')}, ${u.vendido?'vendido':'disponible'}" style="justify-content:flex-start;${u.vendido?'color:var(--suave);border-color:var(--linea);text-decoration:line-through':''}"><b>${u.l}</b>&nbsp;Talla ${esc(u.talla||'—')}</button>`).join('')}</div></div>`
    :`<div class="tarjeta"><div class="fila" style="min-height:0"><span class="t"><b style="font-weight:600">${sold?'Vendida':((p.cantidad||1)>1?`Quedan ${p.cantidad}`:'Disponible')}</b><small>${sold?'Vendida el '+fecha(p.vendidoEl||hoyISO())+'. En la página se ve como vendida unos días.':p.vendidas?`${p.vendidas} ${p.vendidas===1?'vendida':'vendidas'} de esta pieza`:'Al venderla, la página la muestra como vendida al momento.'}</small></span>${sold||p.vendidas?`<button type="button" class="btn chico" data-a="inv-deshacer">Deshacer venta</button>`:''}${sold?'':`<button type="button" class="btn azul chico" data-a="inv-vender">Marcar vendida</button>`}</div></div>`;
  return `<form id="finv" style="display:flex;flex-direction:column;gap:16px" novalidate>
   ${venta}
   <div class="campo"><span>Fotos <small style="font-weight:400">· la primera es la principal</small></span><div class="fotos-inv">${FOTOS.map((f,i)=>`<div class="fi"><img src="${tImg(f)}" alt="Foto ${i+1}">${i===0?'<span class="pr">Principal</span>':`<button type="button" data-fprin="${i}" class="mini-b" aria-label="Hacer principal">★</button>`}${FOTOS.length>1?`<button type="button" data-fquit="${i}" class="mini-b q" aria-label="Quitar foto ${i+1}">×</button>`:''}</div>`).join('')}${FOTOS.length<4?`<label class="fi agregar" tabindex="0" role="button"><span>+</span><small>${FOTOS.length?'Agregar':'Foto principal'}</small><input type="file" accept="image/*" hidden data-invfoto ${FOTOS.length<3?'multiple':''}></label>`:''}</div></div>
   <label class="campo"><span>Nombre</span><input class="in" id="i-nom" maxlength="40" value="${esc(x.nombre)}" placeholder="Por ejemplo, Collar Gota Verde"></label>
   <div class="dos"><label class="campo"><span>Categoría</span><select class="in" id="i-cat"><option value="">Elige una</option>${CATS.map(c=>`<option ${x.cat===c?'selected':''}>${c}</option>`).join('')}</select></label>
   <label class="campo"><span>Precio</span><input class="in" id="i-pre" inputmode="numeric" value="${normal?AVE.fmt(normal):''}" placeholder="₡0"><small>Con IVA incluido</small></label></div>
   <div class="tarjeta"><div class="fila" style="min-height:0"><span class="t">En Oportunidades<small>Precio especial, con el de antes tachado</small></span><button type="button" class="sw" role="switch" aria-checked="${!!oport}" id="i-op" aria-label="En Oportunidades"></button></div>
    <div class="dos" id="i-opc" ${oport?'':'hidden'}><label class="campo"><span>Precio especial</span><input class="in" id="i-opp" inputmode="numeric" value="${oport?AVE.fmt(oport):''}" placeholder="₡0"></label><label class="campo"><span>Motivo</span><select class="in" id="i-mot"><option ${x.descuento!=='Últimas piezas'?'selected':''}>Precio de apertura</option><option ${x.descuento==='Últimas piezas'?'selected':''}>Últimas piezas</option></select></label></div></div>
   ${p&&p.units?'':`<div class="dos"><label class="campo"><span>Cantidad disponible</span><input class="in" id="i-can" inputmode="numeric" value="${x.cantidad||1}"></label><label class="campo"><span>Talla o tamaño</span><input class="in" id="i-tal" maxlength="20" value="${esc(x.talla||'')}" placeholder="Opcional: 7, M, Mediano"></label></div>`}
   <label class="campo"><span>Material</span><input class="in" id="i-mat" maxlength="60" value="${esc(x.material||'')}" placeholder="Opcional"></label>

   <div class="tarjeta"><div class="fila" style="min-height:0"><span class="t">Publicada<small>Apagada, no aparece en la página</small></span><button type="button" class="sw" role="switch" aria-checked="${!x.oculta}" id="i-pub" aria-label="Publicada"></button></div></div>
   <p class="nota" id="i-err" style="color:var(--rojo)" role="alert"></p>

function prepararEditor(){const op=$('#i-op');if(op)op.onclick=()=>{const v=op.getAttribute('aria-checked')!=='true';op.setAttribute('aria-checked',v);$('#i-opc').hidden=!v};const pb=$('#i-pub');if(pb)pb.onclick=()=>pb.setAttribute('aria-checked',String(pb.getAttribute('aria-checked')!=='true'))}
const num=v=>Number(String(v||'').replace(/\D/g,''))||0;
function guardarEditor(){
  const nueva=actual==='nueva', p=nueva?null:INV.find(x=>x.id===EDITA);
  const err=m=>{$('#i-err').textContent=m;$('#i-err').scrollIntoView({block:'center',behavior:'smooth'});return false};
  const nom=$('#i-nom').value.trim(), cat=$('#i-cat').value, pre=num($('#i-pre').value), op=$('#i-op').getAttribute('aria-checked')==='true', opp=num($('#i-opp').value);
  const can=$('#i-can')?Math.max(0,num($('#i-can').value)):null;
  if(!FOTOS.length)return err('Falta la foto principal.');
  if(!nom)return err('Falta el nombre.');
  if(!cat)return err('Elige la categoría.');
  if(!pre)return err('Falta el precio.');
  if(op&&(!opp||opp>=pre))return err('El precio especial tiene que ser menor que el precio normal.');
  if(can!==null&&can<1&&!(p&&vendida(p)))return err('La cantidad disponible es al menos 1.');
  const antes=p?JSON.parse(JSON.stringify(p)):null;
  const x=p||{id:'ave-'+(Math.max(...INV.map(q=>+q.code.split(' ')[1]||0))+1),coleccion:'Paraíso',ingreso:hoyISO(),destacada:false,especial:null,medidas:null};
  if(!p)x.code='Ave '+x.id.split('-')[1];
  Object.assign(x,{nombre:nom,cat,grupo:GRUPO[cat],tipo:cat.toLowerCase(),imgs:[...FOTOS],material:$('#i-mat').value.trim()||null,desc:$('#i-des').value.trim(),oculta:$('#i-pub').getAttribute('aria-checked')!=='true'});
  if(op){x.antes=pre;x.price=opp;x.descuento=$('#i-mot').value}else{x.price=pre;delete x.antes;delete x.descuento}
  if(can!==null){x.cantidad=Math.max(1,can);const t=$('#i-tal').value.trim();if(t)x.talla=t;else delete x.talla}
  if(!p)INV.push(x);
  if(!guardarInv()){if(!p)INV.pop();else Object.assign(p,antes);return}
  FOTOS=[];
  if(nueva){EDITA=x.id;actual='piezas';pintar();aviso(`${x.code} guardada. ${x.oculta?'Está oculta.':'Ya aparece en «Lo nuevo» de la página.'}`)}
  else{pintar();aviso('Guardado. La página ya muestra el cambio.','Deshacer',()=>{const i=INV.findIndex(q=>q.id===antes.id);INV[i]=antes;guardarInv();FOTOS=[];pintar()})}
}
function leerFotosInv(files){const L=[...files].filter(f=>f.type.startsWith('image/')).slice(0,4-FOTOS.length);let k=0;
